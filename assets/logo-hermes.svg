<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hermes Logo (Caduceus)">
  <title>Hermes — Caduceus</title>
  <!-- Caduceus stilisiert: Stab + zwei Schlangen + Flügel-Andeutung -->
  <g transform="translate(32, 32)" stroke="#1A5B53" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Stab (vertikal) -->
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <!-- Linke Schlange -->
    <path d="M 0 -18 Q -10 -13 0 -6 Q 10 1 0 9 Q -10 16 0 20"/>
    <!-- Rechte Schlange -->
    <path d="M 0 -18 Q 10 -13 0 -6 Q -10 1 0 9 Q 10 16 0 20"/>
    <!-- Flügel (klein) -->
    <path d="M -12 -18 Q -5 -24 0 -22 Q 5 -24 12 -18"/>
  </g>
</svg>
