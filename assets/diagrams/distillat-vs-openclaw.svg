      <text x="740" y="630" font-weight="700" fill="#66bb6a">✓</text><text x="762" y="630">Persönlichkeit · Stil · Tonalität</text>
      <text x="740" y="652" font-weight="700" fill="#5a6573">✗</text><text x="762" y="652" fill="#5a6573">Files anlegen + editieren</text>
