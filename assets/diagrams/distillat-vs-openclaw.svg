    <g font-size="14" fill="#e0e0e0">
      <circle cx="120" cy="290" r="3" fill="#c8a44e"/><text x="135" y="294"><tspan font-weight="600">SOUL.md</tspan>  +  <tspan font-weight="600">IDENTITY.md</tspan></text>
