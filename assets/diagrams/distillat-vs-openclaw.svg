         → Block-Breite 307, Block zentriert bei Pille-Mitte 620 -->
    <text x="595" y="1268" text-anchor="middle" font-size="32" font-weight="700" fill="#c8a44e" letter-spacing="0.3">Agent Harnesses</text>
