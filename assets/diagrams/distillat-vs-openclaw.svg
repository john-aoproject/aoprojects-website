<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1080" role="img"
     aria-labelledby="diag-title diag-desc"
     style="font-family:Inter,system-ui,sans-serif;">
  <title id="diag-title">John in zwei Welten — OpenClaw vs. Distillat</title>
  <desc id="diag-desc">Vergleich des vollen OpenClaw-Masters (Identity-Files, Skills, Hooks, MCP-Server, Services, Heartbeat — kann handeln) mit der portablen John-Distillation (vier Identity-Files, kann nur antworten und denken). Beide leben im Obsidian-Vault: Distillat physisch in John Claude Context/, OpenClaw schreibt Logs/Drafts/Memory via obsidian-scribe.</desc>

  <defs>
    <marker id="arrowhead-sync" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa3c2"/>
    </marker>
    <marker id="arrowhead-obs" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a7ad4"/>
    </marker>
  </defs>

