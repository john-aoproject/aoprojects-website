  <!-- ═══════════════════════ OBSIDIAN FOUNDATION ═══════════════════════ -->
  <g>
    <!-- Connector-Labels: ÜBER den dashed lines, nicht auf ihnen -->
    <g text-anchor="middle">
      <!-- Linker Connector-Text (OpenClaw → Obsidian) -->
      <text x="310" y="988" font-size="18" fill="#8a7ad4">writes Logs · Drafts · Memory</text>
      <text x="310" y="1014" font-size="18" fill="#5a4d8a" font-style="italic">via obsidian-scribe</text>
      <!-- Rechter Connector-Text (Distillat → Obsidian) -->
      <text x="930" y="988" font-size="18" fill="#8a7ad4">lives in</text>
      <text x="930" y="1014" font-size="18" fill="#5a4d8a" font-style="italic">John Claude Context/</text>
    </g>

    <!-- Dashed lines (kürzer, unter den Labels) -->
    <line x1="310" y1="1025" x2="310" y2="1060" stroke="#8a7ad4" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="930" y1="1025" x2="930" y2="1060" stroke="#8a7ad4" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Obsidian Vault box -->
    <rect x="180" y="1065" width="880" height="90" rx="12"
          fill="#1a1626" stroke="#4a3a8a" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="620" y="1100" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#b3a2ff" letter-spacing="3">OBSIDIAN VAULT</text>
      <text x="620" y="1132" font-size="15" fill="#888">Sebastians Single Source of Truth</text>
