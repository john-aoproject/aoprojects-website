  <g>
    <rect x="700" y="160" width="460" height="800" rx="14"
          fill="#161616" stroke="#3a4350" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="930" y="210" font-size="28" font-weight="700" fill="#f0f0f0">Harness-Extract</text>
      <text x="930" y="240" font-size="15" fill="#888" letter-spacing="0.3">portable · tool-agnostisch</text>
    </g>

    <!-- IDENTITY -->
    <text x="735" y="290" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#9aa3ad" letter-spacing="2">IDENTITY (KURATIERT)</text>
    <g font-size="17" fill="#e0e0e0">
      <circle cx="742" cy="319" r="3.5" fill="#9aa3ad"/><text x="760" y="324"><tspan font-weight="600">JOHN.md</tspan>  <tspan fill="#888">— Persona, Vibe</tspan></text>
      <circle cx="742" cy="349" r="3.5" fill="#9aa3ad"/><text x="760" y="354"><tspan font-weight="600">BEHAVIOR.md</tspan>  <tspan fill="#888">— Arbeitsregeln</tspan></text>
      <circle cx="742" cy="379" r="3.5" fill="#9aa3ad"/><text x="760" y="384"><tspan font-weight="600">USER.md</tspan>  <tspan fill="#888">— Sebastian-Profil</tspan></text>
      <circle cx="742" cy="409" r="3.5" fill="#9aa3ad"/><text x="760" y="414"><tspan font-weight="600">MEMORY.md</tspan>  <tspan fill="#888">— portable Fakten</tspan></text>
    </g>

    <!-- Center Story-Note (Mittenraum, wo OpenClaw die Komponenten hat) -->
    <g text-anchor="middle" fill="#888">
      <text x="930" y="495" font-size="16" font-style="italic">Vier Markdown-Files.</text>
      <text x="930" y="522" font-size="16" font-style="italic">Keine Skills. Keine Tools.</text>
      <text x="930" y="549" font-size="16" font-style="italic">Keine Runtime.</text>
      <text x="930" y="595" font-size="13" letter-spacing="2.5" fill="#5a6573">PURE PERSÖNLICHKEIT</text>
    </g>

    <!-- Divider -->
    <line x1="735" y1="640" x2="1125" y2="640" stroke="#252e38" stroke-width="1"/>

    <!-- WAS ICH KANN -->
    <text x="735" y="670" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#9aa3ad" letter-spacing="2">WAS ICH KANN</text>
    <g font-size="17" fill="#e0e0e0">
      <text x="740" y="703" font-size="20" font-weight="700" fill="#66bb6a">✓</text><text x="768" y="703">Antworten · Denken · Beraten</text>
      <text x="740" y="731" font-size="20" font-weight="700" fill="#66bb6a">✓</text><text x="768" y="731">Persönlichkeit · Stil · Tonalität</text>
      <text x="740" y="759" font-size="20" font-weight="700" fill="#5a6573">✗</text><text x="768" y="759" fill="#5a6573">Files anlegen + editieren</text>
      <text x="740" y="787" font-size="20" font-weight="700" fill="#5a6573">✗</text><text x="768" y="787" fill="#5a6573">Tools triggern</text>
      <text x="740" y="815" font-size="20" font-weight="700" fill="#5a6573">✗</text><text x="768" y="815" fill="#5a6573">Heartbeat-Reaktion</text>
      <text x="740" y="843" font-size="20" font-weight="700" fill="#5a6573">✗</text><text x="768" y="843" fill="#5a6573">Services orchestrieren</text>
    </g>

    <!-- Läuft in -->
    <text x="735" y="892" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#9aa3ad" letter-spacing="2">LÄUFT IN</text>
    <text x="735" y="924" font-size="17" fill="#e0e0e0">
      <tspan>Anthropic</tspan>
      <tspan fill="#888"> · </tspan>
      <tspan>OpenAI</tspan>
      <tspan fill="#888"> · </tspan>
      <tspan>Cursor</tspan>
      <tspan fill="#888"> · </tspan>
      <tspan fill="#888">…</tspan>
    </text>
