  <!-- ═══════════════════════ CTA — animierter goldener Übergang zur Harnesses-Seite ═══════════════════════ -->
  <a href="harnesses.html" target="_top" class="cta-pill">
    <!-- pulsierender Glow-Ring -->
    <rect class="cta-glow" x="312" y="1208" width="616" height="84" rx="42"
          fill="none" stroke="#c8a44e" stroke-width="2"/>
    <!-- Pille -->
    <rect class="cta-bg" x="320" y="1216" width="600" height="68" rx="34"
          fill="#1a1812" stroke="#c8a44e" stroke-width="2.5"/>
    <!-- Großer Label-Text — Agent Harnesses + animierter Pfeil, beide separat zentriert
