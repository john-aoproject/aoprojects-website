<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" role="img"
     aria-labelledby="diag-title diag-desc"
     style="font-family:Inter,system-ui,sans-serif;">
  <title id="diag-title">John in zwei Welten — Distillat vs. OpenClaw</title>
  <desc id="diag-desc">Vergleich der portablen John-Distillation (vier Files für Claude Projects, ChatGPT, Cursor) mit dem vollen OpenClaw-Master, der zusätzlich Skills, Hooks, MCP-Server, Services und Heartbeat enthält.</desc>

  <defs>
    <!-- Pfeilspitze für Sync-Arrow -->
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa3c2"/>
    </marker>
  </defs>

  <!-- ═══════════════════════ HEADER ═══════════════════════ -->
  <g text-anchor="middle">
    <text x="620" y="58" font-size="38" font-weight="700" fill="#f0f0f0" letter-spacing="-0.5">
      John in zwei Welten
    </text>
    <text x="620" y="92" font-size="15" fill="#888" letter-spacing="0.5">
      Portable Distillation  ·  lokaler Master
    </text>
  </g>

  <!-- ═══════════════════════ CARD: DISTILLAT (links) ═══════════════════════ -->
  <g>
    <!-- Card-Frame -->
    <rect x="80" y="150" width="420" height="430" rx="14"
          fill="#161616" stroke="#3a4350" stroke-width="1.5"/>
    <!-- Card-Title (zentriert) -->
    <g text-anchor="middle">
      <text x="290" y="195" font-size="24" font-weight="700" fill="#f0f0f0">
        John-Distillat
      </text>
      <text x="290" y="222" font-size="13" fill="#888" letter-spacing="0.3">
        portable · tool-agnostisch
      </text>
    </g>

    <!-- Section: IDENTITY -->
    <g font-family="JetBrains Mono, monospace">
      <text x="115" y="270" font-size="11" font-weight="600" fill="#9aa3ad" letter-spacing="2">
        IDENTITY
      </text>
    </g>
    <g font-size="15" fill="#e0e0e0">
      <!-- Bullets als kleine Kreise in Section-Farbe -->
      <circle cx="120" cy="298" r="3.5" fill="#9aa3ad"/>
      <text x="135" y="303"><tspan font-weight="600">JOHN.md</tspan>  <tspan fill="#888">— Persona, Vibe</tspan></text>
      <circle cx="120" cy="326" r="3.5" fill="#9aa3ad"/>
      <text x="135" y="331"><tspan font-weight="600">BEHAVIOR.md</tspan>  <tspan fill="#888">— Arbeitsregeln</tspan></text>
      <circle cx="120" cy="354" r="3.5" fill="#9aa3ad"/>
      <text x="135" y="359"><tspan font-weight="600">USER.md</tspan>  <tspan fill="#888">— Sebastian-Profil</tspan></text>
      <circle cx="120" cy="382" r="3.5" fill="#9aa3ad"/>
      <text x="135" y="387"><tspan font-weight="600">MEMORY.md</tspan>  <tspan fill="#888">— portable Fakten</tspan></text>
    </g>

    <!-- Section: LÄUFT IN -->
    <g font-family="JetBrains Mono, monospace">
      <text x="115" y="438" font-size="11" font-weight="600" fill="#9aa3ad" letter-spacing="2">
        LÄUFT IN
      </text>
    </g>
    <g font-size="15" fill="#e0e0e0">
      <circle cx="120" cy="466" r="3.5" fill="#9aa3ad"/>
      <text x="135" y="471">Claude Projects</text>
      <circle cx="120" cy="494" r="3.5" fill="#9aa3ad"/>
      <text x="135" y="499">ChatGPT Custom GPT</text>
      <circle cx="120" cy="522" r="3.5" fill="#9aa3ad"/>
      <text x="135" y="527">Cursor Rules</text>
    </g>

    <!-- Footer-Note -->
    <text x="290" y="558" text-anchor="middle" font-size="12" font-style="italic" fill="#666">
      4 Files. Keine Runtime nötig.
    </text>
  </g>

  <!-- ═══════════════════════ SYNC-ARROW (zwischen Cards) ═══════════════════════ -->
  <g>
    <!-- Arrow OpenClaw → Distillat -->
    <line x1="740" y1="365" x2="510" y2="365"
          stroke="#7aa3c2" stroke-width="2.2" stroke-linecap="round"
          marker-end="url(#arrowhead)"/>
    <!-- Label zentriert ÜBER dem Pfeil -->
    <g text-anchor="middle" fill="#7aa3c2">
      <text x="625" y="345" font-size="13" font-weight="600" letter-spacing="1">
        SYNC
      </text>
      <text x="625" y="395" font-size="11" fill="#5a7a92" font-style="italic">
        kuratiert
      </text>
    </g>
  </g>

  <!-- ═══════════════════════ CARD: OPENCLAW (rechts) ═══════════════════════ -->
  <g>
    <rect x="740" y="150" width="460" height="570" rx="14"
          fill="#1a1812" stroke="#c8a44e" stroke-width="1.5"/>
    <g text-anchor="middle">
      <text x="970" y="195" font-size="24" font-weight="700" fill="#f0f0f0">
        OpenClaw
      </text>
      <text x="970" y="222" font-size="13" fill="#888" letter-spacing="0.3">
        voller Master · lokale Runtime
      </text>
    </g>

    <!-- Section: IDENTITY-FILES (MASTER) -->
    <g font-family="JetBrains Mono, monospace">
      <text x="775" y="270" font-size="11" font-weight="600" fill="#c8a44e" letter-spacing="2">
        IDENTITY (MASTER)
      </text>
    </g>
    <g font-size="15" fill="#e0e0e0">
      <circle cx="780" cy="298" r="3.5" fill="#c8a44e"/>
      <text x="795" y="303"><tspan font-weight="600">SOUL.md</tspan>  +  <tspan font-weight="600">IDENTITY.md</tspan></text>
      <circle cx="780" cy="326" r="3.5" fill="#c8a44e"/>
      <text x="795" y="331"><tspan font-weight="600">AGENTS.md</tspan></text>
      <circle cx="780" cy="354" r="3.5" fill="#c8a44e"/>
      <text x="795" y="359"><tspan font-weight="600">USER.md</tspan>  +  <tspan font-weight="600">USER-DETAIL.md</tspan></text>
      <circle cx="780" cy="382" r="3.5" fill="#c8a44e"/>
      <text x="795" y="387"><tspan font-weight="600">MEMORY.md</tspan></text>
    </g>

    <!-- Section: KOMPONENTEN -->
    <g font-family="JetBrains Mono, monospace">
      <text x="775" y="438" font-size="11" font-weight="600" fill="#c8a44e" letter-spacing="2">
        + KOMPONENTEN
      </text>
    </g>
    <g font-size="15" fill="#e0e0e0">
      <circle cx="780" cy="466" r="3.5" fill="#c8a44e"/>
      <text x="795" y="471">12 Skills</text>
      <circle cx="780" cy="494" r="3.5" fill="#c8a44e"/>
      <text x="795" y="499">Hooks (Whitelist, Heartbeat)</text>
      <circle cx="780" cy="522" r="3.5" fill="#c8a44e"/>
      <text x="795" y="527">MCP-Server <tspan fill="#888">(Obsidian, Excalidraw, GH)</tspan></text>
      <circle cx="780" cy="550" r="3.5" fill="#c8a44e"/>
      <text x="795" y="555">Services <tspan fill="#888">(Kanban, Discord-Hub)</tspan></text>
      <circle cx="780" cy="578" r="3.5" fill="#c8a44e"/>
      <text x="795" y="583">Heartbeat + LaunchAgents</text>
    </g>

    <!-- Section: LÄUFT IN -->
    <g font-family="JetBrains Mono, monospace">
      <text x="775" y="630" font-size="11" font-weight="600" fill="#c8a44e" letter-spacing="2">
        LÄUFT IN
      </text>
    </g>
    <g font-size="15" fill="#e0e0e0">
      <circle cx="780" cy="658" r="3.5" fill="#c8a44e"/>
      <text x="795" y="663"><tspan font-weight="600">Claude Code Desktop</tspan>  <tspan fill="#888">(lokal · Multi-Session)</tspan></text>
    </g>
  </g>

  <!-- ═══════════════════════ CTA (klickbar zu harnesses.html) ═══════════════════════ -->
  <a href="harnesses.html" target="_top">
    <rect x="420" y="730" width="400" height="42" rx="21"
          fill="none" stroke="#3a4350" stroke-width="1.5"/>
    <text x="620" y="757" text-anchor="middle" font-size="14" fill="#9aa3ad">
      → Wie das technisch zusammenspielt: <tspan font-weight="600" fill="#c8a44e">Agent Harnesses</tspan>
    </text>
  </a>
